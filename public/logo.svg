<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="45%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#451a03" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#fef3c7" stroke-width="3" stroke-opacity="0.25" />

  <!-- Bakery Chef Hat / Crown Icon on Top -->
  <g transform="translate(256, 120)" filter="url(#softShadow)">
    <path d="M-36,26 C-42,26 -52,14 -42,0 C-50,-12 -32,-26 -16,-16 C-8,-28 16,-28 24,-16 C40,-26 58,-12 50,0 C60,14 50,26 44,26 Z" fill="url(#crownGrad)" />
    <path d="M-32,26 L40,26 L36,33 L-28,33 Z" fill="#d97706" />
    <polygon points="0,-36 4,-26 14,-22 4,-18 0,-8 -4,-18 -14,-22 -4,-26" fill="#fef3c7" />
  </g>

  <!-- Typography: AT -->
  <text x="256" y="325"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Kanit, Prompt, Montserrat, sans-serif"
        font-weight="900"
        font-size="168"
        letter-spacing="4"
        fill="url(#goldText)"
        filter="url(#softShadow)">AT</text>

  <!-- Subtitle: BAKERY MASTER -->
  <text x="256" y="380"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Kanit, Prompt, sans-serif"
        font-weight="700"
        font-size="24"
        letter-spacing="8"
        fill="#fef3c7"
        opacity="0.85">BAKERY MASTER</text>
</svg>